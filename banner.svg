<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#111820"/>
    </linearGradient>
    <linearGradient id="accentFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2EA043"/>
      <stop offset="100%" stop-color="#2EA04300"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1C2530" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)" opacity="0.55"/>

  <!-- right-side diagonal accent panel -->
  <polygon points="900,0 1200,0 1200,300 1020,300" fill="#131B22"/>
  <line x1="900" y1="0" x2="1020" y2="300" stroke="#2EA043" stroke-width="2" opacity="0.5"/>

  <!-- code-bracket motif -->
  <text x="1040" y="175" font-family="JetBrains Mono, Fira Code, monospace" font-size="110" fill="#1C2530" font-weight="700">{ }</text>

  <!-- wordmark -->
  <text x="60" y="130" font-family="Helvetica Neue, Arial, sans-serif" font-size="64" font-weight="800" fill="#F0F3F6" letter-spacing="1">JAEDYN DANT</text>

  <!-- accent underline -->
  <rect x="62" y="150" width="140" height="6" fill="#2EA043"/>

  <!-- tagline -->
  <text x="60" y="200" font-family="JetBrains Mono, Fira Code, monospace" font-size="20" fill="#8B949E">full stack developer — design first, code second</text>

  <!-- small meta row -->
  <text x="60" y="245" font-family="JetBrains Mono, Fira Code, monospace" font-size="15" fill="#2EA043">netherlands</text>
  <text x="185" y="245" font-family="JetBrains Mono, Fira Code, monospace" font-size="15" fill="#495562">/</text>
  <text x="200" y="245" font-family="JetBrains Mono, Fira Code, monospace" font-size="15" fill="#8B949E">react · next.js · gsap · postgres</text>
</svg>
